apiVersion: kueue.x-k8s.io/v1beta1
kind: ClusterQueue
metadata:
  name: fraud-cluster-queue
spec:
  namespaceSelector: {} # match all.
  resourceGroups:
    - coveredResources: ["cpu", "memory"]
      flavors:
        - name: default-flavor
          resources:
            - name: cpu
              nominalQuota: 20
            - name: memory
              nominalQuota: 80Gi

